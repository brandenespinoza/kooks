services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: kooks
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    # Both `build` and `image` on purpose. Locally, `docker compose up --build` builds and
    # tags this name. On the VPS, `KOOKS_IMAGE` points at the tag CI pushed to GHCR, so
    # `docker compose pull` fetches it instead of rebuilding from whatever source happens to
    # be sitting in /opt/kooks — which is what a build-only service silently does, deploying
    # stale code while CI reports success.
    image: ${KOOKS_IMAGE:-kooks:local}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/kooks
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
